<style>
@font-face{font-family:'Mm';src:url(data:font/woff2;base64,) format('woff2');}
.lid{transform-box:fill-box;transform-origin:center;animation:blink 7s infinite}
@keyframes blink{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
.pp{animation:look 7s cubic-bezier(.65,0,.25,1) infinite}
@keyframes look{0%,20%{transform:translateX(0)}30%,50%{transform:translateX(-5px)}60%,85%{transform:translateX(5px)}95%,100%{transform:translateX(0)}}
</style>
