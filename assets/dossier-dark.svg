<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550">
<style>
@font-face{font-family:'Cr';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Mm';src:url(data:font/woff2;base64,) format('woff2');}
.r{opacity:0;animation:in 1.1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
<text x="0" y="40" font-family="Mm" font-size="12" letter-spacing="2.4" fill="#ff6a1f">I — SUBJECT</text>
<text x="1200" y="40" text-anchor="end" font-family="Mm" font-size="12" letter-spacing="2.4" fill="#8b7d70">FILE 001 · DECLASSIFIED</text>
<g class="r" style="animation-delay:0.15s">
  <line x1="0" x2="1200" y1="96" y2="96" stroke="#2a221c"/>
  <text x="0" y="134" font-family="Mm" font-size="12" letter-spacing="2.4" fill="#8b7d70">NAME</text>
  <text x="250" y="136" font-family="Cr" font-size="30" fill="#ece3d6">Dhruv Sonar</text>
</g><g class="r" style="animation-delay:0.27s">
  <line x1="0" x2="1200" y1="158" y2="158" stroke="#2a221c"/>
  <text x="0" y="196" font-family="Mm" font-size="12" letter-spacing="2.4" fill="#8b7d70">ALSO</text>
  <text x="250" y="198" font-family="Cr" font-size="30" fill="#ece3d6">sirgreaseball</text>
</g><g class="r" style="animation-delay:0.39s">
  <line x1="0" x2="1200" y1="220" y2="220" stroke="#2a221c"/>
  <text x="0" y="258" font-family="Mm" font-size="12" letter-spacing="2.4" fill="#8b7d70">BASED</text>
  <text x="250" y="260" font-family="Cr" font-size="30" fill="#ece3d6">Hyderabad, India</text>
</g><g class="r" style="animation-delay:0.51s">
  <line x1="0" x2="1200" y1="282" y2="282" stroke="#2a221c"/>
  <text x="0" y="320" font-family="Mm" font-size="12" letter-spacing="2.4" fill="#8b7d70">DAY JOB</text>
  <text x="250" y="322" font-family="Cr" font-size="30" fill="#ece3d6">Computer science &amp; data science at NMIMS. Year three.</text>
</g><g class="r" style="animation-delay:0.63s">
  <line x1="0" x2="1200" y1="344" y2="344" stroke="#2a221c"/>
  <text x="0" y="382" font-family="Mm" font-size="12" letter-spacing="2.4" fill="#8b7d70">NIGHT JOB</text>
  <text x="250" y="384" font-family="Cr" font-size="30" fill="#ece3d6">Building things that look like they cost more than they did.</text>
</g><g class="r" style="animation-delay:0.75s">
  <line x1="0" x2="1200" y1="406" y2="406" stroke="#2a221c"/>
  <text x="0" y="444" font-family="Mm" font-size="12" letter-spacing="2.4" fill="#8b7d70">WEAKNESS</text>
  <text x="250" y="446" font-family="Cr" font-size="30" fill="#ece3d6">One more feature.</text>
</g><g class="r" style="animation-delay:0.87s">
  <line x1="0" x2="1200" y1="468" y2="468" stroke="#2a221c"/>
  <text x="0" y="506" font-family="Mm" font-size="12" letter-spacing="2.4" fill="#8b7d70">STATUS</text>
  <circle cx="254" cy="496" r="5" fill="#ff6a1f"><animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle><text x="272" y="508" font-family="Cr" font-size="30" fill="#ece3d6">Watching.</text>
</g>
<line x1="0" x2="1200" y1="530" y2="530" stroke="#2a221c"/>
</svg>