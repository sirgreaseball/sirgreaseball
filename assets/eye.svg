<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<style>
@font-face{font-family:'Ci';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Mm';src:url(data:font/woff2;base64,) format('woff2');}
.em{animation-name:rise;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.3,.1,.4,1);opacity:0}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}12%{opacity:.95}70%{opacity:.5}100%{opacity:0;transform:translate(var(--dx),-230px)}}
.scan{animation:scan 17s cubic-bezier(.65,0,.25,1) infinite}
@keyframes scan{0%,10%{transform:translateX(0)}20%,38%{transform:translateX(-64px)}50%,66%{transform:translateX(58px)}76%,100%{transform:translateX(0)}}
.dil{transform-box:fill-box;transform-origin:center;animation:dil 17s ease-in-out infinite}
@keyframes dil{0%,8%,80%,100%{transform:scaleX(1)}18%,40%{transform:scaleX(.7)}55%,64%{transform:scaleX(1.55)}}
.breathe{transform-box:fill-box;transform-origin:center;animation:br 6s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.04)}}
.halo{animation:halo 6s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.16}50%{opacity:.09}}
</style>
